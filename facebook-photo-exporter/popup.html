<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Facebook Photo Exporter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>Photo Exporter</h1>
    <p id="hint">Open a Facebook profile/page photos view first.</p>

    <div class="row">
      <button id="start">Start</button>
      <button id="stop" class="secondary">Stop</button>
    </div>

    <div class="row">
      <button id="clear" class="secondary">Clear</button>
      <button id="refresh" class="secondary">Refresh</button>
    </div>

    <div class="row">
      <button id="exportTxt">Export TXT</button>
      <button id="exportJson">Export JSON</button>
    </div>

    <div class="row">
      <button id="copyAll">Copy All</button>
      <button id="refresh2" class="secondary">Refresh</button>
    </div>

    <div class="row">
      <button id="exportCsv">Export CSV</button>
      <button id="copyWithCaption" class="secondary">Copy URL+Caption</button>
    </div>

    <div id="stats">
      <div><strong>Status:</strong> <span id="status">Idle</span></div>
      <div><strong>URLs:</strong> <span id="count">0</span></div>
      <div><strong>Page:</strong> <span id="pageUrl">-</span></div>
      <div><strong>Message:</strong> <span id="message">-</span></div>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
