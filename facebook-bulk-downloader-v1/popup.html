<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FB Bulk Downloader</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>FB Bulk Downloader v1.1</h1>

    <div class="row modes">
      <button id="modeAll" class="mode active">Fetch All</button>
      <button id="modeCount" class="mode">By Count</button>
      <button id="modeDays" class="mode">By Days</button>
    </div>

    <div class="row">
      <label>Count<input id="count" type="number" min="1" value="100" /></label>
      <label>Days<input id="days" type="number" min="1" value="7" /></label>
    </div>

    <div class="row">
      <label>Request Delay (sec)<input id="delay" type="number" min="0" step="0.1" value="1.5" /></label>
      <label>Concurrency<input id="concurrency" type="number" min="1" max="8" value="2" /></label>
    </div>

    <div class="row">
      <label>Folder<input id="folder" type="text" value="facebook-bulk" /></label>
      <label>Template<input id="template" type="text" value="{index}_{caption}" /></label>
    </div>

    <label class="checkbox"><input id="skipExisting" type="checkbox" checked /> Skip existing</label>

    <div class="grid2">
      <button id="collectStart">Collect Start</button>
      <button id="collectStop" class="secondary">Collect Stop</button>
    </div>

    <div class="grid2">
      <button id="enqueue">Add To Queue</button>
      <button id="downloadStart">Download Start</button>
    </div>

    <div class="grid2">
      <button id="downloadStop" class="secondary">Download Stop</button>
      <button id="clearAll" class="secondary">Clear All</button>
    </div>

    <div class="grid2">
      <button id="exportCsv">Export CSV</button>
      <button id="copyMediaTag" class="secondary">Copy url | caption</button>
    </div>

    <button id="syncToApp" style="background:#1877F2;color:#fff;margin-top:6px;width:100%;">Sync to 855Media Desktop App</button>

    <div id="stats"></div>
    <div id="thumbs"></div>
    <p id="msg">-</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
